[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hfcx-sdk"
version = "0.1.0a0"
description = "Official Python SDK for the HealthFlow HFCX platform — Egypt's open protocol for decentralised health-claims data exchange."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "HealthFlow Medical HCX", email = "support@healthflow.gov.eg" },
]
keywords = ["hfcx", "healthflow", "fhir", "jwe", "egypt", "hcx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

# Compile-time dependencies are intentionally narrow at the bootstrap
# (Sprint P1) — every additional dep gets pinned and added in the sprint
# that needs it.
#   P2 adds: jwcrypto, cryptography
#   P3 adds: httpx, cachetools
#   P5 adds: fhir.resources (FHIR validation), fastapi/flask (examples)
#   logging: stdlib + structlog (test scope until P3+)
dependencies = [
    # Sprint P2 — JWE encrypt / decrypt with hard-pinned RSA-OAEP-256 + A256GCM.
    "jwcrypto>=1.5.6",
    "cryptography>=42.0",
    # Sprint P3 — Keycloak token client + Sunbird-RC registry over httpx.
    "httpx>=0.27",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/HealthFlow-Medical-HCX/hfcx_sdks_2026"
Documentation = "https://github.com/HealthFlow-Medical-HCX/hfcx_sdks_2026/tree/main/sdk-python"
Issues = "https://github.com/HealthFlow-Medical-HCX/hfcx_sdks_2026/issues"
"Cross-SDK parity" = "https://github.com/HealthFlow-Medical-HCX/hfcx_sdks_2026/blob/main/docs/CROSS_SDK_PARITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hfcx_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "src/hfcx_sdk",
    "fhir-ig",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

# ─────────────────────────────────────────────────────────────────────
# Tooling
# ─────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line-length is enforced by `line-length`, not by E501
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
no_implicit_reexport = false  # __init__.py re-exports are deliberate
files = ["src/hfcx_sdk", "tests"]

[[tool.mypy.overrides]]
module = [
    "cryptography.*",
    "jwcrypto.*",
    "cachetools.*",
    "httpx.*",
    "respx.*",
    "pytest.*",
    "_pytest.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pytest's parametrize decorator + many of its other helpers are typed
# in a way mypy --strict flags as "untyped decorator". Loosen for tests
# only; the main package stays strict.
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "platform_integration: requires the platform's tests/integration/ stack (mock-payer, mock-provider). Skipped by default.",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/hfcx_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0  # Sprint P1: no coverage floor; raised in P7 after the full surface lands
