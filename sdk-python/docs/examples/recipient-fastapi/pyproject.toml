[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hfcx-recipient-fastapi-example"
version = "0.1.0"
description = "FastAPI example showing how a participant wires the HFCX Python SDK's RecipientHandler into the five inbound endpoints."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

dependencies = [
    "hfcx-sdk",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hfcx_recipient_fastapi"]
