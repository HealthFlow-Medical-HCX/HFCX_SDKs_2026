# HFCX recipient example — defaults. Override via env vars or
# `--hfcx.recipient.private-key-path=` etc. when launching.
hfcx.recipient.participant-code=payerco@hcx-egypt
hfcx.recipient.private-key-path=/run/secrets/hfcx-private-key.pem

# Deployments behind a reverse proxy that already terminates TLS can
# bind to localhost here.
server.port=8080
server.address=0.0.0.0

logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} cid=%X{correlationId:--} - %msg%n
logging.level.org.springframework.web=WARN
logging.level.eg.gov.healthflow=DEBUG
