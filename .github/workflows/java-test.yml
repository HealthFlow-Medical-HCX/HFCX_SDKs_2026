name: java-test

on:
  pull_request:
    paths:
      - "sdk-java/**"
      - ".github/workflows/java-test.yml"
  push:
    branches:
      - main
    paths:
      - "sdk-java/**"
      - ".github/workflows/java-test.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-java
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and verify SDK modules
        run: mvn -B -ntp verify

      - name: Install SDK to local Maven repo
        run: mvn -B -ntp install -DskipTests

      - name: Run consumer smoke test
        working-directory: sdk-java/tests/integration/consumer-smoketest
        run: mvn -B -ntp verify
