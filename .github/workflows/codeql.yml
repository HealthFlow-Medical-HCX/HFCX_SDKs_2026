name: codeql

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly Sunday 03:00 UTC. Catches advisories that landed mid-week
    # without a corresponding code change.
    - cron: "0 3 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Languages added as each SDK lands. Today only Java is implemented.
        language: [java-kotlin]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Default queries plus security-extended for crypto-sensitive code.
          queries: security-extended

      - name: Build sdk-java
        if: matrix.language == 'java-kotlin'
        working-directory: sdk-java
        run: ./mvnw -B -ntp -DskipTests package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
