name: javascript-test

on:
  pull_request:
    paths:
      - "sdk-javascript/**"
      - ".github/workflows/javascript-test.yml"
  push:
    branches:
      - main
    paths:
      - "sdk-javascript/**"
      - ".github/workflows/javascript-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-javascript
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-javascript/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (biome)
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Pack (verify the published tarball assembles)
        run: npm pack --dry-run
