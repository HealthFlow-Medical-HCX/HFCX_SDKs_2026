name: java-publish

# Stubbed Sprint J1 publish workflow.
#
# Triggered by tags of the form `sdk-java/vX.Y.Z`. Activates the `release`
# profile in sdk-java/pom.xml, which signs artifacts with GPG and publishes
# via the Sonatype Central publishing plugin (Sonatype migrated from OSSRH
# to the new Central Portal in 2024 — naming reflects the new portal).
#
# Required GitHub Secrets (set before the first publish; not present yet):
#   - CENTRAL_USERNAME          Sonatype Central portal username
#   - CENTRAL_TOKEN             Sonatype Central portal access token
#   - GPG_PRIVATE_KEY           Armoured GPG private key (`gpg --armor --export-secret-keys`)
#   - GPG_PASSPHRASE            Passphrase for the above key
#
# This workflow intentionally does NOT publish 1.0.0-SNAPSHOT. The release
# is gated on Sprint J7. Until then the workflow only validates that a
# release-profile build assembles cleanly when run manually.

on:
  push:
    tags:
      - "sdk-java/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-java
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          # The setup-java action writes ~/.m2/settings.xml mapping the
          # `central` server-id to the env vars below. The
          # central-publishing-maven-plugin in the parent pom looks up
          # `central` from settings.xml at deploy time.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify or deploy with release profile
        # Asserts the release profile assembles sources/javadoc and the GPG
        # plugin is wired correctly. Skips the actual upload until Central
        # Portal credentials are configured (see header comment).
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ -z "${CENTRAL_USERNAME:-}" || -z "${CENTRAL_TOKEN:-}" || -z "${GPG_PASSPHRASE:-}" ]]; then
            echo "::warning::CENTRAL_USERNAME/CENTRAL_TOKEN/GPG_PASSPHRASE not configured — running release-profile verify only."
            ./mvnw -B -ntp -P release -DskipTests verify -Dgpg.skip=true
          else
            ./mvnw -B -ntp -P release -DskipTests deploy
          fi
